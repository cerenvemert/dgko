<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceren Pacman ❤️</title>

    <link rel="stylesheet" href="pacman.css">
</head>
<body>

<div id="gameContainer">

    <h1>❤️ Ceren Seni Kovalıyor ❤️</h1>

    <p id="info">
        WASD ile kaç! Ceren seni yakalamadan mümkün olduğunca uzun süre dayan. 😂
    </p>

    <canvas id="game" width="800" height="600"></canvas>

    <div id="gameOver" class="hidden">

        <h2>💋 Ceren seni yakaladı!</h2>

        <p>
            Kaçabileceğini mi sandın? ❤️
        </p>

        <button id="restartBtn">
            Tekrar Oyna
        </button>

    </div>
    <div id="gameOver" class="hidden"></div>

</div>

    <audio id="gameMusic" loop>
    <source src="pacman.mp3" type="audio/mpeg">
</audio>

<script src="pacman.js"></script>

</body>
</html>
